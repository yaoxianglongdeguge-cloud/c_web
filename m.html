<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>图片测试</title>
</head>
<body>
    <h1>图片背景测试</h1>
    
    <!-- 方式1：CSS 背景 -->
    <div style="width: 500px; height: 300px; 
                background-image: url('/a.jpeg'); 
                background-size: cover;">
    </div>

    <hr>

    <!-- 方式2：直接显示图片 -->
    <img src="/a.jpeg" width="500">
</body>
</html>
